name: osixia
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: false
      - name: golangci-lint build
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: build

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
      - name: Run build tool tests
        working-directory: build
        run: go test -race ./...

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: govulncheck build
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: '1.26.10'
          work-dir: build

  # each arch is built and tested natively on its own runner instead of under QEMU
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [lint, test, shellcheck, govulncheck]
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache-dependency-path: build/go.sum
      - name: Vendor build go dependencies
        working-directory: build
        run: go mod vendor
      # on tags, images are only exported as OCI archives: the publish job deploys them together
      - name: Run tests
        working-directory: build
        env:
          ARCH: ${{ matrix.arch }}
          GITHUB_TOKEN: ${{ github.ref_type == 'tag' && secrets.GITHUB_TOKEN || '' }}
          OSX_GITHUB_FLAGS: ${{ vars.OSX_GITHUB_FLAGS }}
        run: |
          flags=(--arches "${ARCH}" --github-ref "${GITHUB_REF}")
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            flags+=(--github-token "${GITHUB_TOKEN}" --oci-export-to ../oci)
          fi
          # shellcheck disable=SC2086
          go run main.go provider github ../Dockerfile "${flags[@]}" ${OSX_GITHUB_FLAGS}
      - name: Upload OCI archives
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oci-${{ matrix.arch }}
          path: oci/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: publish
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write
      id-token: write
    env:
      DIGESTS_FILE: ${{ github.workspace }}/digests.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: false
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: Download OCI archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: oci-*
          path: oci/
          merge-multiple: true
      - name: Vendor build go dependencies
        working-directory: build
        run: go mod vendor
      # deploys the images tested by the build jobs as a single multi-arch image per tag
      - name: Run pipeline
        working-directory: build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          OSX_GITHUB_FLAGS: ${{ vars.OSX_GITHUB_FLAGS }}
        run: |
          # shellcheck disable=SC2086
          go run main.go provider github ../Dockerfile --github-ref "${GITHUB_REF}" --github-token "${GITHUB_TOKEN}" --oci-import-from ../oci --changelog ../CHANGELOG.md --username "${REGISTRY_USERNAME}" --password "${REGISTRY_PASSWORD}" --digests-file "${DIGESTS_FILE}" ${OSX_GITHUB_FLAGS}
      - name: Sign images and generate SBOM
        env:
          COSIGN_EXPERIMENTAL: '1'
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          printf '%s' "${REGISTRY_PASSWORD}" | docker login -u "${REGISTRY_USERNAME}" --password-stdin
          while IFS= read -r ref; do
            cosign sign --yes --registry-referrers-mode=oci-1-1 "${ref}"
            syft "${ref}" -o spdx-json > sbom.spdx.json
            cosign attest --yes --predicate sbom.spdx.json --type spdxjson "${ref}"
          done < "${DIGESTS_FILE}"
